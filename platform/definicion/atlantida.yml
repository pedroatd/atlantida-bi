# Documento de definición del sistema de BI de Atlántida Hoteles.
#
# Fuente única de verdad: los capítulos del libro generan sus tablas a partir de
# este fichero; dbt (H4) y Dash (H7) calculan con él el índice de logro; el
# simulador del PMS (H3) lee de aquí los hoteles, el horizonte simulado, la
# desagregación de los paquetes y el calendario de las acciones. Se valida con el
# modelo de atlantida_def.modelos, con el contrato del PMS (contrato_pms.yml) y con
# el de las fuentes externas (contrato_externo.yml).
#
# Cadena de trazabilidad: medida raw (tabla.columna) -> métrica base -> KPI ->
# criterio de un objetivo -> acción. Las fórmulas de los KPI usan solo
# identificadores de métricas base (y la función max) y reproducen la tabla C5
# de la hoja de ruta.

version: "2.5.2"
organizacion: Atlántida Hoteles
periodo_base: 2024
periodo_evaluado: 2025
# Verde: índice >= verde y todos los guardarraíles cumplidos. Logrado (más exigente):
# índice 1 (todos los criterios principales cumplen su meta) y todos los guardarraíles
# cumplidos. Rojo: índice < ambar. Ámbar: el resto.
semaforo: {verde: 0.9, ambar: 0.6}
# Seguimiento intermedio: cada mes, el acumulado del año en curso hasta el cierre del
# mes frente al mismo tramo del año base (atlantida_def.logro.ventanas_ytd).
seguimiento:
  frecuencia: mensual
  comparacion: ytd_vs_ytd_base
  descripcion: Cada mes, al cierre, se calcula el índice de logro con el acumulado del año en curso frente al mismo tramo del año base. El índice anual del periodo evaluado es el del cierre de diciembre.
# Histórico que simula el PMS (H3, SIM_START y SIM_END de platform/.env.example).
# Cubre el año base, el evaluado y las ventanas de todas las acciones (A6's evaluation
# ends 2026-02-28; the horizon extends to 2026-03-31 as margin); el año evaluado de los
# objetivos sigue siendo 2025. Las estancias de los huéspedes empiezan antes
# (historia_huespedes_desde, SIM_HISTORIA_DESDE): la tasa de repetición de 2024 mira
# 24 meses atrás.
horizonte_simulado: {inicio: 2023-01-01, fin: 2026-03-31, historia_huespedes_desde: 2022-01-01}
# Parte del precio de un paquete que es alojamiento, por régimen (rate_plan.board). El
# PMS ya registra stay_night.room_revenue con esta regla aplicada; el resto del precio
# se registra como restauración (folio_charge, department = fnb).
desagregacion_regimen: {RO: 1.0, BB: 0.88, HB: 0.75, FB: 0.65, AI: 0.55}

# ---------------------------------------------------------------------------
# Hoteles (los consume el simulador de H3; tipo = hotel.hotel_type del PMS)
# ---------------------------------------------------------------------------
hoteles:
  - {codigo: TFN, nombre: Atlántida Anaga Ciudad, isla: Tenerife, municipio: Santa Cruz de Tenerife, tipo: urban, estrellas: 4, habitaciones: 160}
  - {codigo: ADJ, nombre: Atlántida Costa Adeje, isla: Tenerife, municipio: Adeje, tipo: resort, estrellas: 4, habitaciones: 320}
  - {codigo: MSP, nombre: Atlántida Mar de Maspalomas, isla: Gran Canaria, municipio: San Bartolomé de Tirajana, tipo: all_inclusive, estrellas: 4, habitaciones: 420}
  - {codigo: TEJ, nombre: Atlántida Casona Roque Nublo, isla: Gran Canaria, municipio: Tejeda, tipo: rural, estrellas: 3, habitaciones: 42}
  - {codigo: YAI, nombre: Atlántida Playa Blanca, isla: Lanzarote, municipio: Yaiza, tipo: resort, estrellas: 4, habitaciones: 280}
  - {codigo: JAN, nombre: Atlántida Jandía Sol, isla: Fuerteventura, municipio: Pájara, tipo: all_inclusive, estrellas: 4, habitaciones: 380}

# ---------------------------------------------------------------------------
# Actores (especificación §2.2)
# ---------------------------------------------------------------------------
actores:
  - id: direccion
    nombre: Dirección general
    nivel: estrategico
    frecuencia: mensual
    necesidad: Índice de logro de los objetivos y su evolución
    kpis: [adr, revpar, trevpar, goppar, cuota_directa, ingreso_perdido_neto, nps, tasa_repeticion, rgi]
  - id: revenue
    nombre: Revenue manager
    nivel: tactico
    frecuencia: diaria
    necesidad: Precios, cupos, pickup y posición frente a la competencia
    kpis: [ocupacion, adr, revpar, pickup, mpi, ari, rgi, tasa_cancelacion, tasa_cancelacion_ota, ingreso_perdido_neto, lead_time_medio, estancia_media]
  - id: marketing
    nombre: Dirección de marketing
    nivel: tactico
    frecuencia: semanal
    necesidad: Mix de canal, campañas y coste de adquisición
    kpis: [ocupacion, goppar, cuota_directa, cuota_directa_captacion, cac_reserva_neta, tasa_repeticion, nps]
  - id: dir_hotel
    nombre: Direcciones de hotel
    nivel: operativo
    frecuencia: diaria
    necesidad: Ocupación, incidencias y reseñas de su hotel
    kpis: [ocupacion, adr, trevpar, goppar, nps, tasa_repeticion, dias_max_aspecto_en_rojo, estancia_media]
  - id: datos
    nombre: Analista e ingeniería de datos
    nivel: soporte
    frecuencia: continua
    necesidad: Calidad, frescura y linaje de los datos; mantiene la definición canónica de todos los KPI en la capa semántica
    kpis: [ocupacion, adr, revpar, trevpar, goppar, cuota_directa, cuota_directa_captacion, cac_reserva_neta, tasa_cancelacion, tasa_cancelacion_ota, ingreso_perdido_neto, nps, tasa_repeticion, dias_max_aspecto_en_rojo, lead_time_medio, estancia_media, pickup, mpi, ari, rgi]

# ---------------------------------------------------------------------------
# Medidas raw: hechos tal como los registran el PMS y las fuentes externas.
# id = <tabla>_<columna>. Las del PMS deben existir en contrato_pms.yml.
# ---------------------------------------------------------------------------
medidas_raw:
  # Inventario
  - {id: room_room_id, fuente: pms, tabla: room, columna: room_id, descripcion: Habitación física del inventario, grano: una fila por habitación}
  - {id: room_hotel_id, fuente: pms, tabla: room, columna: hotel_id, descripcion: Hotel al que pertenece la habitación, grano: una fila por habitación}
  - {id: room_room_type_id, fuente: pms, tabla: room, columna: room_type_id, descripcion: Tipo de la habitación física, grano: una fila por habitación}
  - {id: room_block_room_id, fuente: pms, tabla: room_block, columna: room_id, descripcion: Habitación fuera de servicio, grano: una fila por bloqueo}
  - {id: room_block_start_date, fuente: pms, tabla: room_block, columna: start_date, descripcion: Primer día del bloqueo, grano: una fila por bloqueo}
  - {id: room_block_end_date, fuente: pms, tabla: room_block, columna: end_date, descripcion: Último día del bloqueo, grano: una fila por bloqueo}
  # Noches de estancia
  - {id: stay_night_stay_night_id, fuente: pms, tabla: stay_night, columna: stay_night_id, descripcion: Noche de habitación ocupada, grano: una fila por habitación y noche}
  - {id: stay_night_reservation_id, fuente: pms, tabla: stay_night, columna: reservation_id, descripcion: "Clave de unión: reserva a la que pertenece la noche", grano: una fila por habitación y noche}
  - {id: stay_night_stay_date, fuente: pms, tabla: stay_night, columna: stay_date, descripcion: Fecha de la noche de estancia, grano: una fila por habitación y noche}
  - {id: stay_night_room_revenue, fuente: pms, tabla: stay_night, columna: room_revenue, descripcion: "Ingreso de alojamiento de la habitación esa noche (EUR, neto de IGIC y ya desagregado del régimen según desagregacion_regimen)", grano: una fila por habitación y noche}
  # Cargos de folio (otros ingresos)
  - {id: folio_charge_reservation_id, fuente: pms, tabla: folio_charge, columna: reservation_id, descripcion: "Clave de unión: reserva a cuyo folio se carga (permite segmentar los otros ingresos por canal o huésped)", grano: una fila por cargo}
  - {id: folio_charge_amount, fuente: pms, tabla: folio_charge, columna: amount, descripcion: "Importe del cargo (EUR, neto de IGIC)", grano: una fila por cargo}
  - {id: folio_charge_department, fuente: pms, tabla: folio_charge, columna: department, descripcion: "Departamento del cargo: restauración, spa, minibar, excursiones u otros", grano: una fila por cargo}
  - {id: folio_charge_service_date, fuente: pms, tabla: folio_charge, columna: service_date, descripcion: Fecha en que se prestó el servicio, grano: una fila por cargo}
  # Costes
  - {id: cost_entry_amount, fuente: pms, tabla: cost_entry, columna: amount, descripcion: Importe del coste (EUR), grano: un apunte de coste}
  - {id: cost_entry_category, fuente: pms, tabla: cost_entry, columna: category, descripcion: "Categoría del coste: personal, energía, mantenimiento, coste de restauración, marketing u otros", grano: un apunte de coste}
  - {id: cost_entry_cost_date, fuente: pms, tabla: cost_entry, columna: cost_date, descripcion: Fecha de imputación del coste, grano: un apunte de coste}
  - {id: cost_entry_hotel_id, fuente: pms, tabla: cost_entry, columna: hotel_id, descripcion: Hotel al que se imputa el coste, grano: un apunte de coste}
  # Reservas
  - {id: reservation_reservation_id, fuente: pms, tabla: reservation, columna: reservation_id, descripcion: Reserva, grano: una fila por reserva}
  - {id: reservation_hotel_id, fuente: pms, tabla: reservation, columna: hotel_id, descripcion: Hotel reservado, grano: una fila por reserva}
  - {id: reservation_channel_id, fuente: pms, tabla: reservation, columna: channel_id, descripcion: Canal por el que entra la reserva, grano: una fila por reserva}
  - {id: reservation_room_type_id, fuente: pms, tabla: reservation, columna: room_type_id, descripcion: Tipo de habitación reservado, grano: una fila por reserva}
  - {id: reservation_booked_at, fuente: pms, tabla: reservation, columna: booked_at, descripcion: Momento de creación de la reserva, grano: una fila por reserva}
  - {id: reservation_arrival_date, fuente: pms, tabla: reservation, columna: arrival_date, descripcion: Fecha de llegada, grano: una fila por reserva}
  - {id: reservation_departure_date, fuente: pms, tabla: reservation, columna: departure_date, descripcion: Fecha de salida, grano: una fila por reserva}
  - {id: reservation_status, fuente: pms, tabla: reservation, columna: status, descripcion: "Estado: confirmada, cancelada, no presentado, en casa o salida", grano: una fila por reserva}
  - {id: reservation_total_amount, fuente: pms, tabla: reservation, columna: total_amount, descripcion: "Importe total de la reserva en la divisa del contrato. Supuesto explícito: es el ingreso de habitaciones de toda la estancia, neto de IGIC y desagregado del régimen con la misma regla que stay_night.room_revenue", grano: una fila por reserva}
  - {id: reservation_guest_id, fuente: pms, tabla: reservation, columna: guest_id, descripcion: Ficha titular de la reserva, grano: una fila por reserva}
  - {id: reservation_currency, fuente: pms, tabla: reservation, columna: currency, descripcion: "Divisa del importe (los turoperadores contratan en GBP, SEK, NOK…)", grano: una fila por reserva}
  - {id: reservation_guest_reservation_id, fuente: pms, tabla: reservation_guest, columna: reservation_id, descripcion: "Clave de unión: reserva en la que viaja el huésped", grano: una fila por reserva y huésped}
  - {id: reservation_guest_guest_id, fuente: pms, tabla: reservation_guest, columna: guest_id, descripcion: Huésped (titular o acompañante) que viaja en la reserva, grano: una fila por reserva y huésped}

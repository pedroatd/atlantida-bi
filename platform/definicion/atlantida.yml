  - {id: payment_reservation_id, fuente: pms, tabla: payment, columna: reservation_id, descripcion: "Clave de unión: reserva a la que corresponde el pago", grano: una fila por pago}
  - {id: payment_amount, fuente: pms, tabla: payment, columna: amount, descripcion: Importe del pago (EUR), grano: una fila por pago}
  - {id: payment_payment_type, fuente: pms, tabla: payment, columna: payment_type, descripcion: "Tipo de pago: depósito, saldo o devolución", grano: una fila por pago}
  # Huéspedes (base del golden record)
  - {id: guest_guest_id, fuente: pms, tabla: guest, columna: guest_id, descripcion: Ficha de huésped (puede estar duplicada entre canales), grano: una fila por ficha}

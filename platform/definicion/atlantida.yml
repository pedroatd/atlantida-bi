  - {id: guest_phone, fuente: pms, tabla: guest, columna: phone, descripcion: Teléfono, grano: una fila por ficha}
  - {id: guest_document_id, fuente: pms, tabla: guest, columna: document_id, descripcion: Documento de identidad, grano: una fila por ficha}

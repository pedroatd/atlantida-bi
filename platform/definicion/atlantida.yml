  - {id: channel_commission_rate, fuente: pms, tabla: channel_commission, columna: rate, descripcion: Comisión del canal en tanto por uno, grano: una fila por canal y periodo de vigencia}
  - {id: channel_commission_valid_from, fuente: pms, tabla: channel_commission, columna: valid_from, descripcion: Inicio de vigencia de la comisión, grano: una fila por canal y periodo de vigencia}

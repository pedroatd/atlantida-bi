# Entorno del kit del laboratorio L4: lo crea `uv` la primera vez que ejecutas `make dbt`.
[project]
name = "l04-kit"
version = "0.1.0"
description = "Kit del modelo dimensional de tu proyecto con dbt (laboratorio L4)"
requires-python = "==3.12.*"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-postgres==1.11.0",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
# Mismas versiones que el repositorio del libro (dependencias indirectas de dbt).
constraint-dependencies = [
    "certifi==2026.7.22",
    "click==8.4.2",
    "dbt-core-experimental-parser==2.0.5",
    "dbt-protos==1.0.565",
    "opentelemetry-api==1.45.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "python-slugify==9.1.2",
    "pytimeparse==1.1.9",
    "rpds-py==2026.6.3",
    "sqlglot==28.0.0",
]

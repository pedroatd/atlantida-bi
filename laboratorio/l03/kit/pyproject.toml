# Entorno del kit del laboratorio L3: lo crea `uv` la primera vez que ejecutas `make cargar`.
[project]
name = "l03-kit"
version = "0.1.0"
description = "Kit de carga en crudo de tu proyecto (laboratorio L3)"
requires-python = "==3.12.*"
dependencies = [
    "dlt[postgres,sql-database]==1.30.0",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
# Mismas versiones que el repositorio del libro (dependencias indirectas de dlt).
constraint-dependencies = [
    "click==8.4.2",
    "gitpython==3.2.0",
    "giturlparse==0.15.0",
    "jsonpath-ng==1.8.0",
    "orjson==3.12.0",
    "pendulum==3.2.0",
    "pluggy==1.6.0",
    "sqlalchemy==2.0.49",
    "sqlglot==28.0.0",
    "tenacity==9.1.4",
    "tomlkit==0.15.1",
]
